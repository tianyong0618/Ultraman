name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd ultraman-magic-book
          npm ci

      - name: Build
        run: |
          cd ultraman-magic-book
          npm run build

      - name: Copy dist to root
        run: |
          cp -r ultraman-magic-book/dist ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4