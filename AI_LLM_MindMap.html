const canvas = document.getElementById('mindmap');
const ctx = canvas.getContext('2d');
const container = document.getElementById('canvas-container');
const tooltip = document.getElementById('tooltip');

let scale = 1, offsetX = 0, offsetY = 0;
let isDragging = false, lastX = 0, lastY = 0;
let hoveredNode = null;
let allNodes = [];
let rafPending = false;
let latestMouse = { x: 0, y: 0 };

// 常量定义
const PARTICLE_COUNT = 80;
const PARTICLE_ALPHA = 0.03;
const ROOT_RADIUS_RATIO = 0.01;
const ANGLE_MARGIN_RATIO = 0.05;
const CHILD_RADIUS_LEVEL0 = 0.38;
const CHILD_RADIUS_OTHER = 0.32;
const ZOOM_OUT = 0.9;
const ZOOM_IN = 1.1;
const MIN_SCALE = 0.3;
const MAX_SCALE = 3;
const TOOLTIP_OFFSET_X = 16;
const TOOLTIP_OFFSET_Y = -10;
const TOOLTIP_MAX_WIDTH = 290;
const TOOLTIP_MAX_HEIGHT = 200;

// 辅助函数
function updateTooltipPosition(e) {
  let tx = e.clientX + TOOLTIP_OFFSET_X;
  let ty = e.clientY + TOOLTIP_OFFSET_Y;
  if (tx + TOOLTIP_MAX_WIDTH > window.innerWidth) tx = e.clientX - (TOOLTIP_MAX_WIDTH + TOOLTIP_OFFSET_X);
  if (ty + TOOLTIP_MAX_HEIGHT > window.innerHeight) ty = window.innerHeight - (TOOLTIP_MAX_HEIGHT + Math.abs(TOOLTIP_OFFSET_Y));
  tooltip.style.left = tx + 'px';
  tooltip.style.top = ty + 'px';
}

function calcTouchDist(t1, t2) {
  return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
}

function findNode(wx, wy) {
  let closest = null, minDistSq = Infinity;
  allNodes.forEach(node => {
    const dx = node.x - wx, dy = (node.y + 20) - wy;
    const distSq = dx * dx + dy * dy;
    const hitR = node.level === 0 ? 50 : node.level === 1 ? 45 : 40;
    const hitRSq = hitR * hitR;
    if (distSq < hitRSq && distSq < minDistSq) {
      minDistSq = distSq;
      closest = node;
    }
  });
  return closest;
}

function resize() {
  canvas.width = window.innerWidth * devicePixelRatio;
  canvas.height = window.innerHeight * devicePixelRatio;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}

// 布局算法
function layoutTree(node, x, y, level, angleStart, angleEnd) {
  const w = window.innerWidth, h = window.innerHeight;
  const r = Math.min(w, h) * (level === 0 ? ROOT_RADIUS_RATIO : (level === 1 ? CHILD_RADIUS_LEVEL0 : CHILD_RADIUS_OTHER));

  const angle = (angleStart + angleEnd) / 2;
  const nx = x + Math.cos(angle) * r;
  const ny = y + Math.sin(angle) * r;

  const nodeObj = {
    text: node.text,
    x: nx, y: ny,
    level,
    color: node.color || '#888',
    desc: node.desc || '',
    investors: node.investors || [],
    llms: node.llms || [],
    ides: node.ides || [],
    parentX: x, parentY: y,
    children: []
  };

  allNodes.push(nodeObj);

  if (node.children) {
    const count = node.children.length;
    const angleRange = angleEnd - angleStart;
    const childAngleStart = angleStart + angleRange * ANGLE_MARGIN_RATIO;
    const childAngleEnd = angleEnd - angleRange * ANGLE_MARGIN_RATIO;

    node.children.forEach((child, i) => {
      const cStart = childAngleStart + (childAngleEnd - childAngleStart) * (i / count);
      const cEnd = childAngleStart + (childAngleEnd - childAngleStart) * ((i + 1) / count);
      const childNode = layoutTree(child, nx, ny, level + 1, cStart, cEnd);
      nodeObj.children.push(childNode);
    });
  }

  return nodeObj;
}

function buildLayout() {
  allNodes = [];
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;
  layoutTree(mindmapData, cx, cy, 0, 0, Math.PI * 2);
}

function draw() {
  const w = window.innerWidth, h = window.innerHeight;
  ctx.clearRect(0, 0, w, h);

  ctx.save();
  ctx.globalAlpha = 0.03;
  for (let i = 0; i < 80; i++) {
    const px = ((i * 137.5) % w);
    const py = ((i * 97.3 + i * i * 0.7) % h);
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(px, py, 1.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  ctx.save();
  ctx.translate(offsetX, offsetY);
  ctx.scale(scale, scale);

  allNodes.forEach(node => {
    if (node.level > 0) {
      ctx.beginPath();
      ctx.moveTo(node.parentX, node.parentY);

      // 贝塞尔曲线
      const midX = (node.parentX + node.x) / 2;
      const midY = (node.parentY + node.y) / 2;
      const cp1x = node.parentX + (node.x - node.parentX) * 0.4;
      const cp1y = node.parentY;
      const cp2x = node.parentX + (node.x - node.parentX) * 0.6;
      const cp2y = node.y;

      ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, node.x, node.y);

      const isHovered = hoveredNode && (hoveredNode === node || hoveredNode.parentX === node.x && hoveredNode.parentY === node.y);
      ctx.strokeStyle = isHovered ? node.color + 'cc' : node.color + '30';
      ctx.lineWidth = node.level === 1 ? 2.5 : node.level === 2 ? 1.8 : 1.2;
      ctx.stroke();
    }
  });

  allNodes.forEach(node => {
    const isHovered = hoveredNode === node;
    const baseFontSize = node.level === 0 ? 18 : node.level === 1 ? 15 : node.level === 2 ? 13 : 11;

    if (isHovered || node.level <= 1) {
      ctx.save();
      ctx.globalAlpha = isHovered ? 0.25 : 0.1;
      const glow = ctx.createRadialGradient(node.x, node.y, 0, node.x, node.y, 40 + baseFontSize * 2);
      glow.addColorStop(0, node.color);
      glow.addColorStop(1, 'transparent');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(node.x, node.y, 40 + baseFontSize * 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    const dotR = node.level === 0 ? 8 : node.level === 1 ? 6 : node.level === 2 ? 5 : 4;
    ctx.beginPath();
    ctx.arc(node.x, node.y, dotR, 0, Math.PI * 2);
    ctx.fillStyle = node.color;
    ctx.fill();

    if (isHovered) {
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    ctx.font = `${node.level <= 1 ? '700' : '500'} ${baseFontSize}px "PingFang SC","Microsoft YaHei",sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const textY = node.y + dotR + baseFontSize + 2;

    const metrics = ctx.measureText(node.text);
    const tw = metrics.width + 12;
    const th = baseFontSize + 6;

    ctx.fillStyle = 'rgba(15,15,26,0.85)';
    ctx.beginPath();
    const rx = node.x - tw / 2, ry = textY - th / 2;
    const rr = 4;
    ctx.moveTo(rx + rr, ry);
    ctx.lineTo(rx + tw - rr, ry);
    ctx.quadraticCurveTo(rx + tw, ry, rx + tw, ry + rr);
    ctx.lineTo(rx + tw, ry + th - rr);
    ctx.quadraticCurveTo(rx + tw, ry + th, rx + tw - rr, ry + th);
    ctx.lineTo(rx + rr, ry + th);
    ctx.quadraticCurveTo(rx, ry + th, rx, ry + th - rr);
    ctx.lineTo(rx, ry + rr);
    ctx.quadraticCurveTo(rx, ry, rx + rr, ry);
    ctx.fill();

    if (isHovered) {
      ctx.strokeStyle = node.color + '80';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    ctx.fillStyle = isHovered ? '#fff' : '#ddd';
    ctx.fillText(node.text, node.x, textY);
  });

  ctx.restore();
}

function screenToWorld(sx, sy) {
  return { x: (sx - offsetX) / scale, y: (sy - offsetY) / scale };
}

canvas.addEventListener('mousedown', e => {
  isDragging = true;
  lastX = e.clientX; lastY = e.clientY;
});
canvas.addEventListener('mousemove', e => {
  latestMouse.x = e.clientX;
  latestMouse.y = e.clientY;
  if (!rafPending) {
    rafPending = true;
    requestAnimationFrame(() => {
      rafPending = false;
      const cx = latestMouse.x, cy = latestMouse.y;
      if (isDragging) {
        offsetX += cx - lastX;
        offsetY += cy - lastY;
        lastX = cx; lastY = cy;
        draw();
      }
      const world = screenToWorld(cx, cy);
      const node = findNode(world.x, world.y);
      if (node !== hoveredNode) {
        hoveredNode = node;
        draw();
        if (node && (node.investors.length || node.llms.length || node.ides.length)) {
          let html = `<div class="tt-title" style="color:${node.color}">${node.text}</div>`;
          if (node.desc) html += `<div class="tt-sub">${node.desc}</div>`;
          if (node.investors.length) html += `<div style="margin-top:6px"><b style="color:#ffd93d">💰 投资方：</b>${node.investors.join('、')}</div>`;
          if (node.llms.length) html += `<div style="margin-top:4px"><b style="color:#6bcb77">🤖 LLM：</b>${node.llms.join('、')}</div>`;
          if (node.ides.length) html += `<div style="margin-top:4px"><b style="color:#4d96ff">💻 IDE：</b>${node.ides.join('、')}</div>`;
          tooltip.innerHTML = html;
          tooltip.style.display = 'block';
          updateTooltipPosition({ clientX: cx, clientY: cy });
        } else {
          tooltip.style.display = 'none';
        }
      } else if (node && (node.investors.length || node.llms.length || node.ides.length)) {
        updateTooltipPosition({ clientX: cx, clientY: cy });
      }
    });
  }
});
canvas.addEventListener('mouseup', () => isDragging = false);
canvas.addEventListener('mouseleave', () => {
  isDragging = false;
  hoveredNode = null;
  tooltip.style.display = 'none';
  draw();
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? ZOOM_OUT : ZOOM_IN;
  const newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale * delta));
  const wx = e.clientX, wy = e.clientY;
  offsetX = wx - (wx - offsetX) * (newScale / scale);
  offsetY = wy - (wy - offsetY) * (newScale / scale);
  scale = newScale;
  draw();
}, { passive: false });

let lastTouchDist = 0;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    isDragging = true;
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
  } else if (e.touches.length === 2) {
    isDragging = false;
    lastTouchDist = calcTouchDist(e.touches[0], e.touches[1]);
  }
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && isDragging) {
    offsetX += e.touches[0].clientX - lastX;
    offsetY += e.touches[0].clientY - lastY;
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
    draw();
  } else if (e.touches.length === 2) {
    const dist = calcTouchDist(e.touches[0], e.touches[1]);
    const delta = dist / lastTouchDist;
    scale = Math.max(0.3, Math.min(3, scale * delta));
    lastTouchDist = dist;
    draw();
  }
}, { passive: false });
canvas.addEventListener('touchend', () => isDragging = false);

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { resize(); buildLayout(); draw(); }, 150);
});
resize();
buildLayout();
draw();
</script>
</body>
</html>
