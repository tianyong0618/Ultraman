        - generic [ref=e221]: 帕瓦特·奥特曼（1995年4月8日～1995年7月1日 30分/集 共13集），帕瓦特大概是看上去最酷的奥特曼之一了。虽然他身上红色的花纹和以前的奥特曼很相似，不过他的肌肉更饱满和轮廓分明，他甚至还有颧骨。当他生气的时候，眼镜会由蓝色变成红色。这里面的怪兽也比之前其他系列里的更华丽和有型。帕瓦特也是为数不多的以美籍亚洲人作为主角的美国电视剧，也是奥特曼系列里唯一的有美籍非洲人为队长的。
        - generic [ref=e222]:
          - generic [ref=e223]: 美国播放资料
          - generic [ref=e224]: 某日，地球轨道上出现了未知的巨大卫星，国际防卫队的卫星刚想作威吓性的射击，却遭到不明红光的攻击而被摧毁。到红光坠落现场，调查原因的威那队队员健一·凯伊陷入不明发光空间，与M78星云人相遇。被告之：未知卫星是属于企图侵略地球的巴尔坦星人的，自己作为银河系的保安，紧追巴尔坦来到地球。说完这些，宇宙人遂于凯伊一体化。从此，一个新的巨人--帕瓦特·奥特曼出现了，并将怪兽一个个击败了。
          - generic [ref=e225]: 本作品原创原作，体现出了"奥特曼是属于世界市场"的这一价值观。
          - generic [ref=e226]: 帕瓦特奥特曼资料
          - generic [ref=e227]: 身高：55米 体重：5万8千吨
          - generic [ref=e228]: 出身地：M78星云
          - generic [ref=e229]: 年龄：1万3千岁
          - generic [ref=e230]: 变身器：闪光凌镜
          - generic [ref=e231]: 速度：飞行时最快27马赫，奔跑时可以达到89.99马赫
          - generic [ref=e232]: 力量：双手可以举起13万吨的怪兽，单手可以把5万6千吨的怪兽抛向空中，拳力1亿吨 必杀光线能达到一亿度高温
          - generic [ref=e233]: 切割力：激光手术器以上的切割力量
          - generic [ref=e234]: 跳跃高度：1800米
          - generic [ref=e235]: 高空蹬踏（飞踢）能产生2亿吨的冲击力，平地的蹬塔（直踢）也有1亿吨的冲击力。
          - generic [ref=e236]: 绝招：机械型超级斯派修姆光线，帕瓦特碎裂光环，手掌光弹，隐形光盾（第一集就有，抵挡了巴尔坦星人的声波）
          - generic [ref=e237]: 人间体：健一·凯伊
          - generic [ref=e238]: 地球活动时间：3分钟
          - generic [ref=e239]: 形象解说
          - generic [ref=e240]: 帕瓦特·奥特曼为追击企图征服地球的巴尔坦星人而来到地球，并击退了狂暴的怪兽们，他是一名活跃在
          - generic [ref=e241]: 帕瓦特·奥特曼组合图
          - generic [ref=e242]: 美国的奥特战士。 帕瓦特在剧情等方面都尽量的想再现初代奥特曼，比如奥特曼的造型，怪兽的造型和名称，甚至剧情也大同小异。当然，作为美国的电视剧，其中暴力镜头被控制得很紧。
          - generic [ref=e243]: 剧集目录
          - generic [ref=e244]: 帕瓦特奥特曼战败记录
          - generic [ref=e245]: 帕瓦特12话 Falling Stars Spell Trouble 流星带来灾难
          - generic [ref=e246]: 帕瓦特13话 The Final Showdown? 最终对决？
          - generic [ref=e247]: 大怪兽格斗超银河传说 THE MOVIE
          - generic [ref=e248]: 在光之国与众龙套奥特曼阻击贝利亚失败，被寒流冻成冰块。
          - generic [ref=e249]: 人物介绍
          - generic [ref=e250]: WINR是Worlewide Investigation Network Response的简称,中文翻译即“全球特别调查网络机关”.以专门调查由超自然现象和怪兽、异星人有关的奇怪事件为目的的组织.没有逮捕权限.美国支 部在加利福尼亚州的洛杉矶郊外设有基地.基地在杰顿入侵时被落下的流星毁灭.
          - generic [ref=e251]: 拉塞尔·埃德伦德
          - generic [ref=e252]: 识别编号1。WINR北美分部的队长。有丰富的战斗经验，在战斗任务中表现的相当小心谨慎。也有些幽默感。第一个成为领导奥特援助小组的非裔美国人。
          - generic [ref=e253]: 特雷萨·贝克
          - generic [ref=e254]: 识别编号2。负责分析状况、提出作战方案。其沉着冷静比起埃德伦德队长似乎更像个队长。出色的科学家和战略家。也负责操纵通讯设备。对帕瓦德的正体很有兴趣、知道凯伊和帕瓦德的关系。是翁提卡博士的学生。
          - generic [ref=e255]: 朱丽·扬
          - generic [ref=e256]: 识别编号3。王牌机师。经常对事物感到担心，和桑达斯似乎是对有名搭挡。有个名叫Patty Miller的姐姐和一个叫Karen Miller的侄女。在姐姐面前有很强的自卑感。遭遇了姐夫贾米拉变成怪兽的事件。
          - generic [ref=e257]: 里克·桑德斯
          - generic [ref=e258]: 识别编号4。射击高手。性格具攻击性。非常喜欢讲美式笑话和说俏皮话。一旦名字被叫错就会生气。他本人称是“美国原住民与德意志和法兰西、外加其他七种草药和调味品的混合。”
          - generic [ref=e259]: 健一·凯伊
          - generic [ref=e260]: 识别编号5。WINR的可爱小弟。主要负责驾驶罗帕并收集情报。在调查落到地球的红球的时候，从帕瓦特那里听说了巴尔坦的事，并答应与他同化。通过贝塔胶 囊（在日本翻译为“闪光棱镜”）变身为帕瓦特。由于在与多拉克的战斗中负伤和帕瓦特分离。最后，帕瓦特告诉他每个人心里都拥有光。
          - generic [ref=e261]: 武器介绍
          - generic [ref=e262]: 垂直起降战斗机（Strike VTOL）
          - generic [ref=e263]: 长15.8米，飞行速度3.1马赫，最大载员2人。
          - generic [ref=e264]: WINR主力战机，又称“Hawk”，武器为导弹和激光炮。
          - generic [ref=e265]: 蓝天猎手（Sky Hunter）
          - generic [ref=e266]: WINR的巨大空中母舰，可以以18.5马赫速度飞行，内部装有垂直起降战斗机。巨舰的长度为313米，为UGM以及GUTS的2倍还多。
